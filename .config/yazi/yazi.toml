#:schema https://yazi-rs.github.io/schemas/yazi.json
# 既定値との差分だけを書く (既定値: yazi-config/preset/yazi-default.toml)

[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "natural"
sort_dir_first = true
linemode       = "size"
show_hidden    = true

[preview]
tab_size   = 2
max_width  = 1000
max_height = 1000

[opener]
# 既定は Windows だと VS Code で開くので nvim に寄せる
edit = [
	{ run = "${EDITOR:-nvim} %s", desc = "nvim", for = "unix", block = true },
	{ run = "nvim %s",            desc = "nvim", for = "windows", block = true },
	{ run = "code %s",            desc = "code", for = "windows", orphan = true },
]
