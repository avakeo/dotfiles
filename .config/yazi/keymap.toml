# yazi キーマップ — デフォルトを丸ごとコピーせず prepend_keymap で差分だけ足す
# (コピーするとアップデートで追加されたキーが使えなくなる)
#
# 注意: 以下は外側で先に消費されるので yazi 内では割り当てない
#   Ctrl+h/j/k/l  … WezTerm のペイン移動 (smart_move)
#   Alt+h/j/k/l   … tmux のペイン移動
#   Ctrl+\        … WezTerm の Leader

[mgr]
prepend_keymap = [
  # Enter: ディレクトリなら入る / ファイルなら開く (デフォルトはディレクトリも nvim で開く)
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
  # デフォルトの gh (~) / gc (~/.config) / gd (~/Downloads) に並べて追加
  { on = [ "g", "." ], run = "cd ~/dotfiles", desc = "Go to ~/dotfiles" },
  { on = [ "g", "D" ], run = "cd ~/dotfiles", desc = "Go to ~/dotfiles" },
  { on = [ "g", "w" ], run = "cd ~/work",     desc = "Go to ~/work" },
  # SFTP 接続先 (vfs.toml に定義。マシン固有なので vfs.toml は git 管理外)
  { on = [ "g", "v" ], run = "cd sftp://viber", desc = "Go to viber (SFTP)" },
  # nvim (yazi.nvim) から開いているとき、今のディレクトリを nvim の作業ディレクトリにする。
  # yazi.nvim が nvim-cd メッセージを nvim に転送して :cd する (nvim 外で押しても何も起きない)
  { on = "C", run = 'shell -- ya pub-to 0 nvim-cd --str "$PWD"', desc = "Set nvim cwd to this directory" },
  # 起動したディレクトリへ戻る (YAZI_START_DIR はシェルの y 関数が設定する)
  { on = [ "g", "s" ], run = 'shell -- ya emit cd "${YAZI_START_DIR:-$HOME}"', desc = "Go to the start directory" },
  # 今いるディレクトリを Marta で開く (ドラッグ & ドロップしたいとき用。macOS のみ)
  { on = [ "g", "m" ], run = "shell -- open -a Marta .", desc = "Open cwd in Marta" },
]

[confirm]
prepend_keymap = [
  # 削除などの確認は y でのみ実行する。Enter は普段ディレクトリに入るキーなので、反射で押して消えないようキャンセル扱いにする
  { on = "<Enter>", run = "close", desc = "Cancel the confirm (press y to submit)" },
]
